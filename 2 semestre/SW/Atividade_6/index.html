<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Aluno</title>
</head>
<body>
    <form action="AlunoController.php" method="post">
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" required><br>

        <label for="nota1">Nota 1:</label>
        <input type="number" step="0.1" name="nota1" id="nota1" required><br>

        <label for="nota2">Nota 2:</label>
        <input type="number" step="0.1" name="nota2" id="nota2" required><br>

        <label for="nota3">Nota 3:</label>
        <input type="number" step="0.1" name="nota3" id="nota3" required><br>

        <label for="faltas">Faltas:</label>
        <input type="number" name="faltas" id="faltas" required><br>

        <button type="submit">Calcular Resultado</button>
    </form>
</body>
</html>
