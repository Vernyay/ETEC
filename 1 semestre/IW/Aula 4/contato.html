<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <div class="conteiner">
        <a href="index.html">Voltar</a>
        <h2>Cadastro de Usuário</h2>

        <!--TRABALHANDO COM FORMULÁRIO-->
        <form>
            <fieldset>

            <legend>Dados Pessoais</legend>

            <label>Nome: </label>
            <input type="text" required/>

            <br/>

            <label>E-mail: </label>
            <input type="email" required/>

            <br/>

            <label>Telefone:</label>
            <input type="tel" placeholder="(00) 00000-0000"/>

            <br/>

            <label>CPF: </label>
            <input type="text" maxlength="11" required/>

            <br/>

            <label>Data de nascimento: </label>
            <input type="date"/>

            <br/>
        </fieldset>

        <fieldset>

            <legend>Endereço</legend>

            <label>Rua: </label>
            <input type="text"/>

            <br/>

            <label>Número:</label>
            <input type="number"/>

            <br/>

            <label>Cidade:</label>
            <input type="text">

            <br/>

            <label>UF:</label>
            <select>

                <option>SP</option>

                <option>RJ</option>

                <option>PA</option>

                <option>MG</option>

                <option>RS</option>

                <option>PE</option>

            </select>

        </fieldset>

        <fieldset>

            <legend>Informações Adicionais</legend>

            <label>Sexo:</label>
            <input type="radio" name="sexo" class="inline"/>Masculino
            <input type="radio" name="sexo" class="inline"/>Feminino
            <input type="radio" name="sexo" class="inline"/>Outros

            <br/>
            <br/>

           <label>Hobbies: </label>
           <input type="checkbox"> Esporte
           <input type="checkbox"> Jogos
           <input type="checkbox"> Música
           <input type="checkbox"> Leitura
           <br/>
           <br/>

           <label>Observações</label>
           <textarea rows="4"></textarea>

        </fieldset>

        <input type="submit"/>

        </form>
    </div>
</body>
</html>
