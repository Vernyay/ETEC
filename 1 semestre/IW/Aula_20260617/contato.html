    <main>
        <h2>Envie uma mensagem</h2>
        <p>Tem alguma dúvida, sugestão ou quer reservar uma mesa para a sua equipe? Preencha o formulário abaixo:</p>
        <form action="#" method="post">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            
            <label for="assunto">Assunto:</label>
            <select id="assunto" name="assunto">
                <option value="reserva">Reserva de Mesa</option>
                <option value="sugestao">Sugestão</option>
                <option value="reclamacao">Reclamação</option>
            </select>
            
            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
            
            <button type="submit">Enviar Mensagem</button>
        </form>
    </main>
